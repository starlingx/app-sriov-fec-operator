apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    control-plane: controller-manager
  name: sriov-fec-controller-manager
  namespace: sriov-fec-system
spec:
  replicas: 2
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=127.0.0.1:8080
        - --leader-elect
        command:
        - /manager
        env:
        - name: SRIOV_FEC_IMAGE_PULL_SECRET
          value: {{.Values.env.SRIOV_FEC_IMAGE_PULL_SECRET}}
        - name: SRIOV_FEC_DAEMON_IMAGE
          value: {{.Values.env.SRIOV_FEC_DAEMON_IMAGE}}
        - name: SRIOV_FEC_LABELER_IMAGE
          value: {{.Values.env.SRIOV_FEC_LABELER_IMAGE}}
        - name: SRIOV_FEC_NETWORK_DEVICE_PLUGIN_IMAGE
          value: {{.Values.env.SRIOV_FEC_NETWORK_DEVICE_PLUGIN_IMAGE}}
        - name: SRIOV_FEC_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SRIOV_FEC_GENERIC_K8S
          valueFrom:
            configMapKeyRef:
              key: isGeneric
              name: operator-configuration
              optional: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        image: "{{ .Values.manager.image.repository}}:{{ .Values.manager.image.tag}}"
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 200m
            memory: 100Mi
          requests:
            cpu: 100m
            memory: 20Mi
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      - args:
        - --secure-listen-address=0.0.0.0:8443
        - --upstream=http://127.0.0.1:8080/
        - --logtostderr=true
        - --v=10
        image: "{{.Values.kubeRbacProxy.image.repository}}:{{ .Values.kubeRbacProxy.image.tag}}"
        name: "{{.Values.kubeRbacProxy.name}}"
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
      serviceAccountName: sriov-fec-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: webhook-server-cert
