apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: sriov-fec-system/sriov-fec-serving-cert
  name: sriov-fec-validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: sriov-fec-webhook-service
      namespace: sriov-fec-system
      path: /validate-sriovfec-intel-com-v2-sriovfecclusterconfig
  failurePolicy: Fail
  name: vsriovfecclusterconfig.kb.io
  rules:
  - apiGroups:
    - sriovfec.intel.com
    apiVersions:
    - v2
    operations:
    - CREATE
    - UPDATE
    resources:
    - sriovfecclusterconfigs
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: sriov-fec-webhook-service
      namespace: sriov-fec-system
      path: /validate-sriovvrb-intel-com-v1-sriovvrbclusterconfig
  failurePolicy: Fail
  name: vsriovvrbclusterconfig.kb.io
  rules:
  - apiGroups:
    - sriovvrb.intel.com
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - sriovvrbclusterconfigs
  sideEffects: None
