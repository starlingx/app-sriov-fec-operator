---
- project:
    check:
      jobs:
        - openstack-tox-linters
        - k8sapp-sriov-fec-operator-tox-py39
        - k8sapp-sriov-fec-operator-tox-pylint
        - k8sapp-sriov-fec-operator-tox-flake8
        - k8sapp-sriov-fec-operator-tox-metadata
    gate:
      jobs:
        - openstack-tox-linters
        - k8sapp-sriov-fec-operator-tox-py39
        - k8sapp-sriov-fec-operator-tox-pylint
        - k8sapp-sriov-fec-operator-tox-flake8
        - k8sapp-sriov-fec-operator-tox-metadata

    post:
      jobs:
        - stx-app-sriov-fec-operator-upload-git-mirror

- job:
    name: k8sapp-sriov-fec-operator-tox-py39
    parent:  openstack-tox-py39
    description: |
        Run py39 for sriov-fec-operator app
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    files:
      - python3-k8sapp-sriov-fec-operator/*
    vars:
        tox_extra_args: -c python3-k8sapp-sriov-fec-operator/k8sapp_sriov_fec_operator/tox.ini
        tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-sriov-fec-operator-tox-metadata
    parent: tox
    description: |
      Run metadata test for k8sapp_sriov_fec_operator
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    nodeset: debian-bullseye
    vars:
      tox_envlist: metadata
      tox_extra_args: -c python3-k8sapp-sriov-fec-operator/k8sapp_sriov_fec_operator/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-sriov-fec-operator-tox-pylint
    parent: tox
    description: |
      Run pylint test for k8sapp_sriov_fec_operator
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    nodeset: debian-bullseye
    files:
      - python3-k8sapp-sriov-fec-operator/*
    vars:
      tox_envlist: pylint
      tox_extra_args: -c python3-k8sapp-sriov-fec-operator/k8sapp_sriov_fec_operator/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-sriov-fec-operator-tox-flake8
    parent: tox
    description: |
      Run flake8 test for k8sapp_sriov_fec_operator
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    nodeset: debian-bullseye
    files:
      - python3-k8sapp-sriov-fec-operator/*
    vars:
      tox_envlist: flake8
      tox_extra_args: -c python3-k8sapp-sriov-fec-operator/k8sapp_sriov_fec_operator/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: stx-app-sriov-fec-operator-upload-git-mirror
    parent: upload-git-mirror
    description: >
      Mirrors opendev.org/starlingx/app-sriov-fec-operator to
      github.com/starlingx/app-sriov-fec-operator
    vars:
      git_mirror_repository: starlingx/app-sriov-fec-operator
    secrets:
      - name: git_mirror_credentials
        secret: stx-app-sriov-fec-operator-github-secret
        pass-to-parent: true

