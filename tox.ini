[tox]
envlist = linters
minversion = 2.3
skipsdist = True
sitepackages=False

[testenv]
install_command = pip install -U {opts} {packages}
setenv =
   VIRTUAL_ENV={envdir}
   OS_STDOUT_CAPTURE=1
   OS_STDERR_CAPTURE=1
   OS_DEBUG=1
   OS_LOG_CAPTURE=1
deps =
  -r{toxinidir}/requirements.txt
  -r{toxinidir}/test-requirements.txt
allowlist_externals =
  bash

passenv =
    XDG_CACHE_HOME


[testenv:bashate]
# Treat all E* codes as Errors rather than warnings using: -e 'E*'
commands =
  bash -c "find {toxinidir}                    \
         -not \( -type d -name .?\* -prune \) \
         -type f                              \
         -not -name \*~                       \
         -not -name \*.md                     \
         -name \*.sh                          \
         -print0 | xargs -r -n 1 -0 bashate -v   \
         -e 'E*'"

[testenv:linters]
commands =
    {[testenv:bashate]commands}

[testenv:flake8]
basepython = python3
description = Dummy environment to allow flake8 to be run in subdir tox

[testenv:pylint]
basepython = python3
description = Dummy environment to allow pylint to be run in subdir tox

[testenv:metadata]
basepython = python3
description = Dummy environment to allow sysinv-app to be run in s

[testenv:bandit]
basepython = python3
description = Dummy environment to allow bandit to be run in subdir tox


[testenv:coverage]
basepython = python3.9
allowlist_externals =
  bash
  mkdir
  tee
commands =
  bash -c "mkdir -p {toxinidir}/UTCoverage && \
    cd {toxinidir} && \
    pip install pytest pytest-cov PyYAML mock && \
    pytest tests/ \
      --cov=python3-k8sapp-sriov-fec-operator/k8sapp_sriov_fec_operator/k8sapp_sriov_fec_operator/common \
      --cov=python3-k8sapp-sriov-fec-operator/k8sapp_sriov_fec_operator/k8sapp_sriov_fec_operator/helm \
      --cov=python3-k8sapp-sriov-fec-operator/k8sapp_sriov_fec_operator/k8sapp_sriov_fec_operator/lifecycle \
      --cov-report=term-missing \
      --cov-report=html:{toxinidir}/UTCoverage/htmlcov \
      --cov-report=xml:{toxinidir}/UTCoverage/coverage.xml \
      --cov-fail-under=85 \
      -v --tb=short 2>&1 | tee {toxinidir}/UTCoverage/coverage_report.txt"

[testenv:security]
basepython = python3.9
allowlist_externals =
  bash
  mkdir
commands =
  bash -c "mkdir -p {toxinidir}/UTCoverage && \
    cd {toxinidir}/python3-k8sapp-sriov-fec-operator/k8sapp_sriov_fec_operator && \
    pip install bandit && \
    bandit -n 5 -r k8sapp_sriov_fec_operator \
      -s B101,B103,B104,B105,B108,B110,B303,B307,B310,B311,B314,B318,B320,B404,B405,B408,B410,B506,B602,B603,B604,B605,B607,B608 \
      --exclude k8sapp_sriov_fec_operator/tests \
      -f txt -o {toxinidir}/UTCoverage/security_report.txt || true && \
    bandit -n 5 -r k8sapp_sriov_fec_operator \
      -s B101,B103,B104,B105,B108,B110,B303,B307,B310,B311,B314,B318,B320,B404,B405,B408,B410,B506,B602,B603,B604,B605,B607,B608 \
      --exclude k8sapp_sriov_fec_operator/tests \
      -f json -o {toxinidir}/UTCoverage/bandit-report.json || true"

[testenv:py313]
basepython = python3.13
description = Dummy environment to allow py313 to be run in subdir tox

[testenv:flake8-trixie]
basepython = python3
description = Dummy environment to allow flake8-trixie to be run in subdir tox

